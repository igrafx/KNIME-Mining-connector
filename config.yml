org.igx.igrafx_extension: # {group_id}.{name} from the knime.yml
  src: C:/Path/to/KNIME-Mining-connector # Path to folder containing the extension files
  conda_env_path:  C:/Path/to/python/environment # Path to the Python environment to use, eg: .pixi/envs/default
  debug_mode: false # Optional line, if set to true, it will always use the latest changes of execute/configure, when that method is used within the KNIME Analytics Platform
  python_path:
    - C:/Path/to/KNIME-Mining-connector/src # if necessary set the path to where the extension module is located (src)