[workspace]
name = "igrafx-knime-extension"
version = "1.4.1"
authors = ["iGrafx <support@igrafx.com>"]
description = "iGrafx Mining Knime Extension."
license = "MIT"
license-file = "LICENSE.TXT"
readme = "README.md"
repository = "https://github.com/igrafx/KNIME-Mining-connector"
channels = ["knime", "conda-forge", "https://repo.anaconda.com/pkgs/main", "https://repo.anaconda.com/pkgs/r"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = { cmd = "pytest" }
format = { cmd = "ruff format ." }

# ======================
# Platform-specific conda dependencies
# ======================

[target.win-64.dependencies]
python = ">=3.11.0, <3.12.1"
ca-certificates = "2024.2.2.*"
libflang = "5.0.0.*"
ucrt = "10.0.22621.0.*"
networkx= ">=3.3.0, <3.6.1"


[target.linux-64.dependencies]
ca-certificates = "2023.11.17.*"
networkx= ">=3.3.0, <3.6.1"

[target.osx-64.dependencies]
ca-certificates = "2023.11.17.*"
libcxx = ">=18"
networkx= ">=3.3.0, <3.6.1"

[target.osx-arm64.dependencies]
python = ">=3.11.0, <3.12.1"
networkx= ">=3.3.0, <3.6.1"

[pypi-dependencies]
certifi = ">=2023.11.17,<2027.0.0"
charset-normalizer = ">=3.3.2,<4.0.0"
greenlet = ">=3.0.3,<4.0.0"
idna = ">=3.7,<4.0"
igrafx-mining-sdk = ">=2.38.1,<3.0.0"
networkx = ">=3.3.0,<3.6.1"
python-dotenv = ">=1.2.2,<2.0.0"
sqlalchemy = ">=2.0.48,<3.0.0"
toml = ">=0.10.2,<1.0.0"
typing-extensions = ">=4.11.0,<5.0.0"

[target.unix.dependencies]
pixi-pycharm = "*"

[feature.build.dependencies]
python = ">=3.11.0, <3.12.1"
knime-extension-bundling = "5.5.*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "python ./.pixi/envs/build/bin/build_python_extension.py . {{ dest }}" }

[environments]
build = {features = ["build"], no-default-feature = true}

[dependencies]
python = ">=3.11.0, <3.12.1"
knime-extension-bundling = "5.5.0.*"
knime-extension = "*"
knime-python-base = "*"
pixi-pycharm = ">=0.0.8,<0.0.9"
py4j = ">=0.10.9.9,<0.11"
pandas = ">=2.0.3,<2.1.0"
pydruid = "0.6.9.*"
requests = "2.32.5.*"
urllib3 = "2.5.0.*"


